<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ToolDr.ai — Design Editor v2</title>
<style>
:root{--bg:#0d0f12;--panel:#15181d;--panel2:#1b1f25;--line:#2b3038;--text:#f5f7fa;--muted:#9299a5;--blue:#2787ff;--blue2:#1e6fd2;--danger:#6b2529}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{color:var(--text);background:#22262d;border:1px solid #343a44;border-radius:9px;cursor:pointer}button:active{transform:translateY(1px)}button:hover{background:#2a3038}.app{height:100vh;display:grid;grid-template-rows:60px 1fr;overflow:hidden}.top{display:flex;align-items:center;gap:12px;padding:0 14px;background:#111318;border-bottom:1px solid var(--line);z-index:20}.brand{font-size:20px;font-weight:900;white-space:nowrap}.brand b{color:#5bb7ff}.brand small{font-size:9px;color:#737b87;letter-spacing:1.4px;margin-left:7px}.top-actions{display:flex;gap:6px;margin-left:auto;overflow:auto}.top-actions button{padding:8px 11px;white-space:nowrap}.primary{background:var(--blue);border-color:var(--blue)}.primary:hover{background:var(--blue2)}
.main{min-height:0;display:grid;grid-template-columns:245px minmax(0,1fr) 285px}.panel{background:var(--panel);min-width:0}.left{border-right:1px solid var(--line);padding:12px;overflow:auto}.right{border-left:1px solid var(--line);padding:12px;overflow:auto}.section-title{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1.1px;text-transform:uppercase;margin:4px 0 10px}.add-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:15px}.add-grid button{padding:9px 4px;font-size:11px}.layers{display:flex;flex-direction:column;gap:4px}.layer-row{display:grid;grid-template-columns:26px 1fr 28px 28px;gap:4px;align-items:center;width:100%;padding:7px 5px;border-radius:8px;background:transparent;text-align:left}.layer-row.selected{background:#21374d;border-color:#3e8fd5}.layer-main{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.layer-icon{color:#68baff;font-weight:800;font-size:11px}.mini{width:28px;height:28px;padding:0;display:grid;place-items:center;font-size:12px}.muted{color:var(--muted)}
.stage{min-width:0;min-height:0;background:#090b0e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}.canvas-wrap{max-width:92%;max-height:84%;position:relative;box-shadow:0 22px 80px #000;border-radius:2px}.canvas{display:block;background:#f7f2e8;touch-action:none}.canvas-overlay{position:absolute;inset:0;pointer-events:none}.selection{position:absolute;border:1px solid #3ba2ff;box-shadow:0 0 0 1px #0b65ad;pointer-events:none}.handle{position:absolute;width:10px;height:10px;background:#fff;border:1px solid #1478c8;border-radius:2px;pointer-events:auto}.handle.nw{left:-6px;top:-6px;cursor:nwse-resize}.handle.n{left:50%;top:-6px;transform:translateX(-50%);cursor:ns-resize}.handle.ne{right:-6px;top:-6px;cursor:nesw-resize}.handle.e{right:-6px;top:50%;transform:translateY(-50%);cursor:ew-resize}.handle.se{right:-6px;bottom:-6px;cursor:nwse-resize}.handle.s{left:50%;bottom:-6px;transform:translateX(-50%);cursor:ns-resize}.handle.sw{left:-6px;bottom:-6px;cursor:nesw-resize}.handle.w{left:-6px;top:50%;transform:translateY(-50%);cursor:ew-resize}.rotate{width:12px;height:12px;border-radius:50%;left:50%;top:-28px;transform:translateX(-50%);background:#3ba2ff;border:2px solid white;cursor:grab;pointer-events:auto;position:absolute}.rotate-line{position:absolute;left:50%;top:-18px;height:18px;border-left:1px dashed #3ba2ff}.stage-info{font-size:11px;color:#737b87}.zoom{position:absolute;right:12px;bottom:12px;background:#171a1f;border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;align-items:center;gap:4px}.zoom button{width:30px;height:30px}.zoom span{width:52px;text-align:center;font-size:11px;color:#b7bec8}
.form{display:flex;flex-direction:column;gap:9px}.form label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}.form input,.form select,.form textarea{width:100%;background:#0d0f12;color:var(--text);border:1px solid #343a44;border-radius:7px;padding:8px}.form textarea{min-height:72px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row{display:flex;gap:6px}.row>*{flex:1}.danger{background:#3b1d20;border-color:#613034}.danger:hover{background:#4b2327}.toolbar-row{display:flex;gap:5px;margin:10px 0}.toolbar-row button{padding:7px 8px;font-size:11px}.status{margin-top:12px;padding:9px;background:#101318;border:1px solid var(--line);border-radius:8px;font-size:11px;color:#7fcf9a}.project{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.hint{font-size:10px;line-height:1.5;color:#717985;margin-top:10px}
@media(max-width:980px){.main{grid-template-columns:205px minmax(0,1fr)}.right{position:fixed;right:0;top:60px;bottom:0;width:min(320px,92vw);transform:translateX(100%);transition:transform .2s;z-index:15;box-shadow:-20px 0 60px #000}.right.open{transform:none}.top .brand small{display:none}.stage{grid-column:2}.canvas-wrap{max-width:96%;max-height:78%}}
@media(max-width:700px){.app{grid-template-rows:auto 1fr}.top{min-height:58px;flex-wrap:wrap;padding:8px}.top-actions{width:100%;margin-left:0;order:3}.top-actions button{font-size:11px;padding:7px 9px}.main{grid-template-columns:1fr;grid-template-rows:1fr auto}.left{position:fixed;left:0;top:58px;bottom:0;width:min(290px,88vw);transform:translateX(-100%);transition:transform .2s;z-index:16;box-shadow:20px 0 60px #000}.left.open{transform:none}.stage{grid-column:1;grid-row:1;min-height:0}.stage-info{margin-bottom:48px}.canvas-wrap{max-width:94%;max-height:76%}.zoom{bottom:12px}.mobile-toggle{display:inline-block!important}.brand{font-size:18px}.right{top:58px}.add-grid{grid-template-columns:repeat(3,1fr)}}
.mobile-toggle{display:none}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">ToolDr<b>.ai</b><small>DESIGN EDITOR V2</small></div>
  <button class="mobile-toggle" id="layersToggle">☰ Layers</button>
  <button class="mobile-toggle" id="propsToggle">⚙ Properties</button>
  <div class="top-actions">
    <button id="newBtn">New</button><button id="saveBtn">Save</button><button id="loadBtn">Load</button><button id="importBtn">Import JSON</button><button id="sceneBtn">Scene JSON</button><button class="primary" id="pngBtn">Export PNG</button>
  </div>
</header>
<div class="main">
<aside class="panel left" id="leftPanel">
  <div class="section-title">Add layer</div>
  <div class="add-grid"><button id="addText">＋ Text</button><button id="addShape">＋ Shape</button><button id="addImage">＋ Image</button></div>
  <input id="imageInput" type="file" accept="image/*" hidden>
  <div class="section-title">Layers</div>
  <div id="layers" class="layers"></div>
  <div class="hint">Tip: select a layer, then drag it on the canvas. Use the blue handles to resize and the round handle to rotate.</div>
</aside>
<main class="stage">
  <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas" class="canvas" width="1080" height="1350"></canvas><div id="overlay" class="canvas-overlay"></div></div>
  <div class="stage-info">1080 × 1350 · drag / resize / rotate · selected layer is editable</div>
  <div class="zoom"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button><button id="fitBtn">Fit</button></div>
</main>
<aside class="panel right" id="rightPanel">
  <div class="section-title">Properties</div><div id="props" class="form"><div class="muted">Select a layer</div></div>
  <div class="project form"><div class="section-title">Project</div><label>Name<input id="projectName" value="Untitled Design"></label><label>Background<input id="projectBg" type="color" value="#f7f2e8"></label><div id="status" class="status">Editor v2 ready</div></div>
</aside>
</div></div>
<script>
'use strict';
const W=1080,H=1350;
const FONTS=['Inter','Arial','Georgia','Trebuchet MS','Courier New','Caveat','Poppins','Montserrat','Impact'];
let scene={version:2,background:'#f7f2e8',layers:[]};let selected=null;let zoom=0.58;let interaction=null;
const $=id=>document.getElementById(id);const canvas=$('canvas'),ctx=canvas.getContext('2d'),overlay=$('overlay'),wrap=$('canvasWrap'),layersEl=$('layers'),props=$('props'),status=$('status');
const projectName=$('projectName'),projectBg=$('projectBg');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
const cur=()=>scene.layers.find(l=>l.id===selected);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function setStatus(t){status.textContent=t}
function addLayer(layer){scene.layers.push({...layer,id:uid()});selected=scene.layers.at(-1).id;render()}
function defaultText(){addLayer({type:'text',name:'Headline',x:90,y:110,w:760,h:110,text:'AI TOOLS',fill:'#111111',fontFamily:'Inter',fontSize:76,fontWeight:800,align:'left',opacity:1,rotation:0})}
function defaultShape(){addLayer({type:'shape',name:'Shape',x:90,y:330,w:420,h:220,fill:'#2f80ed',radius:24,opacity:1,rotation:0})}
function addImageFile(file){const reader=new FileReader();reader.onload=()=>addLayer({type:'image',name:file.name,x:90,y:400,w:650,h:430,src:reader.result,opacity:1,rotation:0,fit:'cover'});reader.readAsDataURL(file)}
function drawRoundedRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawLayer(c,l){if(l.hidden)return;c.save();c.globalAlpha=l.opacity??1;const cx=l.x+l.w/2,cy=l.y+l.h/2;c.translate(cx,cy);c.rotate((l.rotation||0)*Math.PI/180);if(l.type==='shape'){c.fillStyle=l.fill||'#ddd';drawRoundedRect(c,-l.w/2,-l.h/2,l.w,l.h,l.radius||0);c.fill()}else if(l.type==='image'){if(l._img&&l._img.complete){const iw=l._img.naturalWidth||l._img.width,ih=l._img.naturalHeight||l._img.height;if(l.fit==='contain'){const s=Math.min(l.w/iw,l.h/ih),dw=iw*s,dh=ih*s;c.drawImage(l._img,-dw/2,-dh/2,dw,dh)}else{const s=Math.max(l.w/iw,l.h/ih),dw=iw*s,dh=ih*s;c.drawImage(l._img,-dw/2,-dh/2,dw,dh)}}else{c.fillStyle='#d9dde3';c.fillRect(-l.w/2,-l.h/2,l.w,l.h)}}else if(l.type==='text'){c.fillStyle=l.fill||'#111';c.font=`${l.fontWeight||700} ${l.fontSize||56}px "${l.fontFamily||'Inter'}",Arial,sans-serif`;c.textBaseline='top';c.textAlign=l.align||'left';const lines=String(l.text||'').split('\n'),lh=(l.fontSize||56)*1.08;let tx=l.align==='center'?0:l.align==='right'?l.w/2:-l.w/2;lines.forEach((line,i)=>c.fillText(line,tx,-l.h/2+i*lh))}c.restore()}
function renderCanvas(){ctx.clearRect(0,0,W,H);ctx.fillStyle=scene.background;ctx.fillRect(0,0,W,H);scene.layers.forEach(drawLayer.bind(null,ctx));renderOverlay()}
function renderOverlay(){overlay.innerHTML='';const l=cur();if(!l)return;const box=document.createElement('div');box.className='selection';box.style.left=(l.x*zoom)+'px';box.style.top=(l.y*zoom)+'px';box.style.width=(l.w*zoom)+'px';box.style.height=(l.h*zoom)+'px';box.style.transform=`rotate(${l.rotation||0}deg)`;box.style.transformOrigin='center';box.dataset.id=l.id;
['nw','n','ne','e','se','s','sw','w'].forEach(pos=>{const h=document.createElement('div');h.className='handle '+pos;h.dataset.resize=pos;h.addEventListener('pointerdown',startResize);box.appendChild(h)});const line=document.createElement('div');line.className='rotate-line';box.appendChild(line);const rh=document.createElement('div');rh.className='rotate';rh.addEventListener('pointerdown',startRotate);box.appendChild(rh);overlay.appendChild(box)}
function renderLayers(){layersEl.innerHTML='';[...scene.layers].reverse().forEach(l=>{const row=document.createElement('div');row.className='layer-row '+(l.id===selected?'selected':'');const icon=l.type==='text'?'T':l.type==='image'?'IMG':'▣';row.innerHTML=`<button class="layer-main" title="Select">${icon} <span>${esc(l.name||'Layer')}</span></button><button class="mini" data-action="vis">${l.hidden?'◌':'◉'}</button><button class="mini" data-action="lock">${l.locked?'🔒':'↕'}</button>`;row.querySelector('.layer-main').onclick=()=>{selected=l.id;render()};row.querySelector('[data-action=vis]').onclick=()=>{l.hidden=!l.hidden;render()};row.querySelector('[data-action=lock]').onclick=()=>{l.locked=!l.locked;render()};layersEl.appendChild(row)})}
function renderProps(){const l=cur();if(!l){props.innerHTML='<div class="muted">Select a layer</div>';return}const color=l.fill||'#111111';props.innerHTML=`<label>Name<input data-k="name" value="${esc(l.name||'Layer')}"></label><div class="grid2"><label>X<input data-k="x" type="number" value="${Math.round(l.x)}"></label><label>Y<input data-k="y" type="number" value="${Math.round(l.y)}"></label><label>Width<input data-k="w" type="number" value="${Math.round(l.w)}"></label><label>Height<input data-k="h" type="number" value="${Math.round(l.h)}"></label><label>Rotation<input data-k="rotation" type="number" value="${Math.round(l.rotation||0)}"></label><label>Opacity<input data-k="opacity" type="number" min="0" max="1" step=".05" value="${l.opacity??1}"></label></div>`+
(l.type==='text'?`<label>Text<textarea data-k="text">${esc(l.text||'')}</textarea></label><label>Font<select data-k="fontFamily">${FONTS.map(f=>`<option value="${f}" ${f===(l.fontFamily||'Inter')?'selected':''}>${f}</option>`).join('')}</select></label><div class="grid2"><label>Size<input data-k="fontSize" type="number" value="${l.fontSize||56}"></label><label>Weight<input data-k="fontWeight" type="number" step="100" min="100" max="900" value="${l.fontWeight||700}"></label></div><label>Alignment<select data-k="align"><option ${l.align==='left'?'selected':''}>left</option><option ${l.align==='center'?'selected':''}>center</option><option ${l.align==='right'?'selected':''}>right</option></select></label>`:'')+
(l.type==='shape'?`<div class="grid2"><label>Fill<input data-k="fill" type="color" value="${color}"></label><label>Radius<input data-k="radius" type="number" value="${l.radius||0}"></label></div>`:'')+
`<div class="toolbar-row"><button id="dup">Duplicate</button><button id="front">Bring front</button><button id="back">Send back</button></div><button id="delete" class="danger">Delete layer</button>`;
props.querySelectorAll('[data-k]').forEach(input=>input.addEventListener('input',()=>{const k=input.dataset.k;let v=input.value;if(['x','y','w','h','rotation','opacity','fontSize','fontWeight','radius'].includes(k))v=Number(v);l[k]=v;normalize(l);render()}));$('delete').onclick=()=>{scene.layers=scene.layers.filter(x=>x.id!==l.id);selected=null;render()};$('dup').onclick=()=>{const copy={...l,id:uid(),name:(l.name||'Layer')+' copy',x:Math.min(W-l.w,l.x+24),y:Math.min(H-l.h,l.y+24)};scene.layers.push(copy);selected=copy.id;render()};$('front').onclick=()=>{scene.layers=scene.layers.filter(x=>x.id!==l.id);scene.layers.push(l);render()};$('back').onclick=()=>{scene.layers=scene.layers.filter(x=>x.id!==l.id);scene.layers.unshift(l);render()}}
function normalize(l){l.w=clamp(Number(l.w)||1,10,W);l.h=clamp(Number(l.h)||1,10,H);l.x=clamp(Number(l.x)||0,0,W-l.w);l.y=clamp(Number(l.y)||0,0,H-l.h);l.rotation=Number(l.rotation)||0;l.opacity=clamp(Number(l.opacity??1),0,1)}
function render(){scene.layers.forEach(l=>{if(l.src&&!l._img){l._img=new Image();l._img.onload=renderCanvas;l._img.src=l.src}});renderCanvas();renderLayers();renderProps();projectBg.value=scene.background;zoomLabel.textContent=Math.round(zoom*100)+'%';wrap.style.width=(W*zoom)+'px';wrap.style.height=(H*zoom)+'px';canvas.style.width=(W*zoom)+'px';canvas.style.height=(H*zoom)+'px'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function canvasPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function startDrag(e){const l=cur();if(!l||l.locked)return;const p=canvasPoint(e);interaction={kind:'move',sx:p.x,sy:p.y,ox:l.x,oy:l.y};e.preventDefault()}
function startResize(e){const l=cur();if(!l||l.locked)return;e.stopPropagation();const p=canvasPoint(e);interaction={kind:'resize',handle:e.currentTarget.dataset.resize,sx:p.x,sy:p.y,ox:l.x,oy:l.y,ow:l.w,oh:l.h};window.addEventListener('pointermove',onResize);window.addEventListener('pointerup',endInteraction,{once:true})}
function onResize(e){const l=cur();if(!l||!interaction)return;const p=canvasPoint(e),d=interaction,dx=p.x-d.sx,dy=p.y-d.sy;let x=d.ox,y=d.oy,w=d.ow,h=d.oh;if(d.handle.includes('e'))w=d.ow+dx;if(d.handle.includes('s'))h=d.oh+dy;if(d.handle.includes('w')){x=d.ox+dx;w=d.ow-dx}if(d.handle.includes('n')){y=d.oy+dy;h=d.oh-dy}if(w<20){if(d.handle.includes('w'))x=d.ox+d.ow-20;w=20}if(h<20){if(d.handle.includes('n'))y=d.oy+d.oh-20;h=20}l.x=x;l.y=y;l.w=w;l.h=h;normalize(l);render()}
function startRotate(e){const l=cur();if(!l||l.locked)return;e.stopPropagation();const r=canvas.getBoundingClientRect(),cx=(l.x+l.w/2)/W*r.width+r.left,cy=(l.y+l.h/2)/H*r.height+r.top;interaction={kind:'rotate',cx,cy,base:l.rotation||0};window.addEventListener('pointermove',onRotate);window.addEventListener('pointerup',endInteraction,{once:true})}
function onRotate(e){const l=cur();if(!l||!interaction)return;const a=Math.atan2(e.clientY-interaction.cy,e.clientX-interaction.cx)*180/Math.PI+90;l.rotation=Math.round(interaction.base+a);render()}
function endInteraction(){window.removeEventListener('pointermove',onResize);window.removeEventListener('pointermove',onRotate);interaction=null}
function hitTest(px,py){for(let i=scene.layers.length-1;i>=0;i--){const l=scene.layers[i];if(l.hidden||l.locked)continue;const cx=l.x+l.w/2,cy=l.y+l.h/2,a=-(l.rotation||0)*Math.PI/180,dx=px-cx,dy=py-cy,rx=dx*Math.cos(a)-dy*Math.sin(a),ry=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(rx)<=l.w/2&&Math.abs(ry)<=l.h/2)return l}return null}
canvas.addEventListener('pointerdown',e=>{const p=canvasPoint(e),hit=hitTest(p.x,p.y);if(hit){selected=hit.id;startDrag(e);render()}else{selected=null;render()}});window.addEventListener('pointermove',e=>{if(!interaction||interaction.kind!=='move')return;const l=cur();if(!l)return;const p=canvasPoint(e),d=interaction;l.x=d.ox+(p.x-d.sx);l.y=d.oy+(p.y-d.sy);normalize(l);render()});window.addEventListener('pointerup',endInteraction);
$('addText').onclick=defaultText;$('addShape').onclick=defaultShape;$('addImage').onclick=()=>$('imageInput').click();$('imageInput').onchange=e=>{if(e.target.files[0])addImageFile(e.target.files[0]);e.target.value=''};
projectBg.oninput=()=>{scene.background=projectBg.value;renderCanvas()};
$('newBtn').onclick=()=>{scene={version:2,background:'#f7f2e8',layers:[]};selected=null;projectName.value='Untitled Design';setStatus('New scene');render()};
$('saveBtn').onclick=()=>{const clean=structuredClone?structuredClone(scene):JSON.parse(JSON.stringify(scene));clean.layers.forEach(l=>delete l._img);localStorage.setItem('tooldr-scene-v2',JSON.stringify(clean));localStorage.setItem('tooldr-name-v2',projectName.value);setStatus('Saved locally ✓')};
$('loadBtn').onclick=()=>{const s=localStorage.getItem('tooldr-scene-v2');if(!s){setStatus('No saved scene');return}scene=JSON.parse(s);selected=null;projectName.value=localStorage.getItem('tooldr-name-v2')||'Untitled Design';setStatus('Loaded locally ✓');render()};
$('sceneBtn').onclick=()=>download('tooldr-scene.json',JSON.stringify({name:projectName.value,scene:stripRuntime(scene)},null,2),'application/json');
$('importBtn').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);scene=o.scene||o;scene.version=2;selected=null;projectName.value=o.name||'Imported Design';setStatus('Imported ✓');render()}catch(err){setStatus('Invalid JSON')}};r.readAsText(f)};i.click()};
function stripRuntime(s){const o=JSON.parse(JSON.stringify(s));o.layers.forEach(l=>delete l._img);return o}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('pngBtn').onclick=async()=>{setStatus('Rendering PNG…');try{const out=document.createElement('canvas');out.width=W;out.height=H;const c=out.getContext('2d');c.fillStyle=scene.background;c.fillRect(0,0,W,H);for(const l of scene.layers){if(l.hidden)continue;if(l.type==='image'&&!l._img&&l.src){await new Promise(res=>{l._img=new Image();l._img.onload=res;l._img.onerror=res;l._img.src=l.src})}drawLayer(c,l)}const a=document.createElement('a');a.href=out.toDataURL('image/png');a.download=(projectName.value||'tooldr-design').replace(/[^a-z0-9-_]+/gi,'-')+'.png';a.click();setStatus('PNG exported ✓')}catch(e){console.error(e);setStatus('PNG export failed')}};
$('zoomIn').onclick=()=>{zoom=clamp(zoom+0.1,.25,1.2);render()};$('zoomOut').onclick=()=>{zoom=clamp(zoom-0.1,.25,1.2);render()};$('fitBtn').onclick=()=>{const stage=document.querySelector('.stage');zoom=clamp(Math.min((stage.clientWidth-50)/W,(stage.clientHeight-100)/H),.25,1);render()};
$('layersToggle').onclick=()=>$('leftPanel').classList.toggle('open');$('propsToggle').onclick=()=>$('rightPanel').classList.toggle('open');
window.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&cur()&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){scene.layers=scene.layers.filter(x=>x.id!==selected);selected=null;render()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('saveBtn').click()}});
window.addEventListener('resize',()=>render());render();
</script>
</body></html>
