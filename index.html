<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToolDr Design Editor</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}header{padding:14px 18px;background:#181818;position:sticky;top:0}main{display:flex;gap:20px;padding:20px;min-height:calc(100vh - 60px)}aside{width:240px;background:#191919;padding:15px;border-radius:12px}section{flex:1;display:flex;align-items:center;justify-content:center;background:#090909;border-radius:12px;overflow:auto}.canvas{position:relative;width:540px;height:675px;background:#f5efe3;box-shadow:0 20px 60px #000}.layer{position:absolute}.title{font-size:42px;font-weight:900;line-height:.95}.blue{color:#247bd8}.card{background:#fffdf8;border-radius:12px;padding:14px;box-sizing:border-box}.cta{background:#151515;color:white;border-radius:16px}.btn{padding:10px 15px;border:0;border-radius:8px;background:#247bd8;color:white}button{padding:9px;margin:3px;border-radius:7px;border:1px solid #444;background:#252525;color:#fff}</style></head><body><header><b>ToolDr.ai</b> — Editable Design Editor v5</header><main><aside><h3>Layers</h3><button onclick="addText()">＋ Text</button><button onclick="addShape()">＋ Shape</button><button onclick="loadTemplate()">AI Writing Template</button><button onclick="clearCanvas()">Blank</button><p>Every poster element is an independent editable layer. No flattened reference image.</p><div id="list"></div></aside><section><div id="c" class="canvas"></div></section></main><script>const c=document.getElementById('c'),list=document.getElementById('list');let n=0;function layer(name,html,css=''){const e=document.createElement('div');e.className='layer';e.innerHTML=html;e.style.cssText=css;e.draggable=true;e.dataset.name=name;e.onclick=()=>{document.querySelectorAll('.layer').forEach(x=>x.style.outline='');e.style.outline='2px solid #39a5ff'};e.onmousedown=ev=>{let x=ev.clientX-e.offsetLeft,y=ev.clientY-e.offsetTop;function m(q){e.style.left=q.clientX-x+'px';e.style.top=q.clientY-y+'px'}function u(){removeEventListener('mousemove',m);removeEventListener('mouseup',u)}addEventListener('mousemove',m);addEventListener('mouseup',u)};c.appendChild(e);let b=document.createElement('button');b.textContent=name;b.onclick=()=>e.click();list.appendChild(b)}function clearCanvas(){c.innerHTML='';list.innerHTML=''}function addText(){layer('Text','Edit text','left:40px;top:40px;font-size:32px;font-weight:700;color:#222')}function addShape(){layer('Shape','','left:40px;top:120px;width:180px;height:100px;background:#247bd8;border-radius:15px')}function loadTemplate(){clearCanvas();layer('Eyebrow','AI TOOLS • WRITING','left:35px;top:25px;font-size:10px;font-weight:800;color:#222');layer('Title','AI <span class="blue">WRITING</span><br>TOOLS','left:35px;top:105px;width:400px');layer('Subtitle','Write, rewrite, summarize and create better content — faster with AI.','left:35px;top:235px;width:330px;font-size:14px;color:#555');['Write 10× Faster|Save hours of work','Better Content|Clear, creative and engaging','Overcome Writer’s Block|Get ideas instantly','For Everyone|Students, creators, professionals'].forEach((x,i)=>{let a=x.split('|');layer(a[0],'<b>'+a[0]+'</b><br><small>'+a[1]+'</small>','left:35px;top:'+(285+i*65)+'px;width:300px;height:54px;background:'+(i%2?'#e9f1f7':'#fffdf8')+';padding:10px;border-radius:9px;box-sizing:border-box')});layer('Laptop','<b>ChatGPT</b><br><br>Create better.<br>Write faster.','left:370px;top:285px;width:125px;height:115px;background:#252d38;color:#fff;padding:15px;box-sizing:border-box;border-radius:10px');layer('Tools','ChatGPT · Notion AI<br>Grammarly · Copy.ai','left:360px;top:420px;width:145px;padding:12px;background:#fffdf8;border-radius:10px;font-size:11px;color:#222');layer('Sticky','Good Content<br>Creates Opportunities','left:390px;top:505px;width:120px;height:70px;background:#d7ef8c;padding:12px;box-sizing:border-box;color:#202820;font-weight:700;transform:rotate(4deg)');layer('CTA','<b>AI Writing Tools</b><br><small>Top tools to boost your writing</small>','left:35px;top:590px;width:470px;height:65px;padding:15px;box-sizing:border-box')};loadTemplate();</script></body></html>
