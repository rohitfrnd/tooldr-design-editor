<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ToolDr.ai Design Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#eee;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.top{height:62px;border-bottom:1px solid #2c2c2c;background:#181818;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;position:sticky;top:0;z-index:10}.logo{font-weight:900}.logo i{font-style:normal;color:#52b5ff}.logo small{color:#777;margin-left:7px;letter-spacing:1px}.actions{display:flex;gap:7px;flex-wrap:wrap}button{border:1px solid #3a3a3a;background:#242424;color:#eee;border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{background:#303030}.primary{background:#2378db;border-color:#2378db}.danger{background:#432121;border-color:#643030}.app{display:grid;grid-template-columns:240px 1fr 260px;min-height:calc(100vh - 62px)}aside{background:#181818;padding:14px;border-color:#2b2b2b}.left{border-right:1px solid #2b2b2b}.right{border-left:1px solid #2b2b2b}h3{font-size:12px;text-transform:uppercase;color:#aaa;letter-spacing:1px;margin:4px 0 12px}.add{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}.add button{font-size:11px;padding:8px 3px}.layers{display:flex;flex-direction:column;gap:4px}.layer{width:100%;display:flex;align-items:center;gap:8px;text-align:left}.layer.on{background:#263b50;border-color:#4c9ee8}.layer .type{width:25px;color:#61b8ff}.stage{background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;min-width:0}.frame{height:min(76vh,760px);aspect-ratio:1080/1350;max-width:100%;background:#f7f2e8;box-shadow:0 20px 70px #000;position:relative;overflow:hidden}.canvas{width:100%;height:100%;position:relative;user-select:none;touch-action:none}.obj{position:absolute;cursor:move;display:flex;align-items:center;justify-content:flex-start;overflow:hidden}.obj.selected{outline:2px solid #3195ff;outline-offset:1px}.text{white-space:pre-wrap;line-height:1.05}.img{background:#ddd center/cover no-repeat}.rect{width:100%;height:100%}.tip{font-size:11px;color:#777;margin-top:10px}.props{display:flex;flex-direction:column;gap:8px}.props label,.project label{font-size:11px;color:#999;display:flex;flex-direction:column;gap:4px}.props input,.props textarea,.props select,.project input{background:#0f0f0f;border:1px solid #3a3a3a;color:#eee;border-radius:7px;padding:7px;font:inherit}.props textarea{min-height:65px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.empty{color:#777;font-size:13px}.project{border-top:1px solid #2d2d2d;margin-top:18px;padding-top:15px;display:flex;flex-direction:column;gap:9px}.status{font-size:11px;color:#72ca8a}.json{font-size:10px;color:#666;word-break:break-all}.hidden{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}.stage{order:-1;min-height:72vh;padding:12px}.left,.right{border:0;border-top:1px solid #2b2b2b}.left{padding-bottom:10px}.right{padding-top:14px}.layers{max-height:190px;overflow:auto}.top{height:auto;min-height:62px;padding:9px;flex-wrap:wrap}.actions{margin-left:auto}.actions button{font-size:11px;padding:7px 8px}.logo small{display:none}}
</style></head>
<body>
<header class="top"><div class="logo">ToolDr<i>.ai</i><small>DESIGN EDITOR</small></div><div class="actions"><button id="new">New</button><button id="save">Save</button><button id="load">Load</button><button id="import">Import JSON</button><button id="exportJson">Scene JSON</button><button class="primary" id="png">Export PNG</button></div></header>
<div class="app"><aside class="left"><h3>Layers</h3><div class="add"><button id="textAdd">＋ Text</button><button id="shapeAdd">＋ Shape</button><button id="imgAdd">＋ Image</button></div><input id="file" class="hidden" type="file" accept="image/*"><div id="layers" class="layers"></div></aside>
<main class="stage"><div class="frame"><div id="canvas" class="canvas"></div></div><div class="tip">Drag layers • Select a layer to edit • 1080 × 1350</div></main>
<aside class="right"><h3>Properties</h3><div id="props" class="props empty">Select a layer</div><div class="project"><h3>Project</h3><label>Name<input id="name" value="Untitled Design"></label><label>Background<input id="bg" type="color" value="#f7f2e8"></label><div id="status" class="status">Local editor ready</div></div></aside></div>
<script>
const W=1080,H=1350,fonts=['Inter','Arial','Georgia','Trebuchet MS','Courier New','Caveat','Poppins','Montserrat'];let scene={version:1,background:'#f7f2e8',layers:[]},selected=null,drag=null;
const $=id=>document.getElementById(id),canvas=$('canvas'),layersEl=$('layers'),props=$('props'),status=$('status'),name=$('name'),bg=$('bg');
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const current=()=>scene.layers.find(x=>x.id===selected);
function add(o){scene.layers.push({...o,id:uid()});selected=scene.layers.at(-1).id;render()}
function render(){canvas.innerHTML='';canvas.style.background=scene.background;scene.layers.forEach(l=>{let e=document.createElement('div');e.className='obj '+l.type+(l.id===selected?' selected':'');e.dataset.id=l.id;e.style.left=l.x/W*100+'%';e.style.top=l.y/H*100+'%';e.style.width=l.w/W*100+'%';e.style.height=l.h/H*100+'%';e.style.opacity=l.opacity??1;if(l.type==='text'){e.classList.add('text');e.textContent=l.text||'';e.style.fontFamily=l.fontFamily||'Inter';e.style.fontSize=(l.fontSize||56)/W*100+'vw';e.style.fontWeight=l.fontWeight||700;e.style.color=l.fill||'#111';e.style.alignItems='flex-start'}if(l.type==='rect'){e.style.background=l.fill||'#ddd';e.style.borderRadius=(l.radius||0)/W*100+'vw'}if(l.type==='image'){e.style.backgroundImage='url('+l.src+')';e.style.backgroundSize='cover';e.style.backgroundPosition='center'}e.addEventListener('pointerdown',startDrag);canvas.appendChild(e)});renderLayers();renderProps()}
function renderLayers(){layersEl.innerHTML='';[...scene.layers].reverse().forEach(l=>{let b=document.createElement('button');b.className='layer '+(l.id===selected?'on':'');b.innerHTML='<span class="type">'+(l.type==='text'?'T':l.type==='image'?'IMG':'▣')+'</span>'+esc(l.name);b.onclick=()=>{selected=l.id;render()};layersEl.appendChild(b)})}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function renderProps(){let l=current();if(!l){props.className='props empty';props.textContent='Select a layer';return}props.className='props';props.innerHTML='<label>Name<input data-k="name" value="'+esc(l.name)+'"></label><div class="grid"><label>X<input data-k="x" type="number" value="'+l.x+'"></label><label>Y<input data-k="y" type="number" value="'+l.y+'"></label><label>Width<input data-k="w" type="number" value="'+l.w+'"></label><label>Height<input data-k="h" type="number" value="'+l.h+'"></label></div>'+(l.type==='text'?'<label>Text<textarea data-k="text">'+esc(l.text||'')+'</textarea></label><label>Font<select data-k="fontFamily">'+fonts.map(f=>'<option '+(f===(l.fontFamily||'Inter')?'selected':'')+'>'+f+'</option>').join('')+'</select></label><div class="grid"><label>Size<input data-k="fontSize" type="number" value="'+(l.fontSize||56)+'"></label><label>Weight<input data-k="fontWeight" type="number" step="100" value="'+(l.fontWeight||700)+'"></label></div>':'')+(l.type!=='image'?'<label>Fill<input data-k="fill" type="color" value="'+(l.fill||'#111111')+'"></label>':'')+'<label>Opacity<input data-k="opacity" type="number" min="0" max="1" step=".05" value="'+(l.opacity??1)+'"></label><button id="del" class="danger">Delete layer</button>';
props.querySelectorAll('[data-k]').forEach(i=>i.addEventListener('input',()=>{let k=i.dataset.k,v=i.value;l[k]=['x','y','w','h','fontSize','fontWeight','opacity'].includes(k)?Number(v):v;render()}));$('del').onclick=()=>{scene.layers=scene.layers.filter(x=>x.id!==l.id);selected=null;render()}}
function startDrag(ev){selected=ev.currentTarget.dataset.id;let l=current(),r=canvas.getBoundingClientRect();drag={l,sx:ev.clientX,sy:ev.clientY,ox:l.x,oy:l.y,cw:r.width,ch:r.height};ev.currentTarget.setPointerCapture(ev.pointerId);render()}
canvas.addEventListener('pointermove',ev=>{if(!drag)return;let d=drag,l=d.l;let dx=(ev.clientX-d.sx)/d.cw*W,dy=(ev.clientY-d.sy)/d.ch*H;l.x=Math.max(0,Math.min(W-l.w,d.ox+dx));l.y=Math.max(0,Math.min(H-l.h,d.oy+dy));render()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
$('textAdd').onclick=()=>add({type:'text',name:'Headline',x:90,y:100,w:760,h:100,text:'AI TOOLS',fill:'#111111',fontFamily:'Inter',fontSize:72,fontWeight:800,opacity:1});$('shapeAdd').onclick=()=>add({type:'rect',name:'Shape',x:100,y:300,w:420,h:220,fill:'#2f80ed',radius:24,opacity:1});$('imgAdd').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>add({type:'image',name:f.name,x:100,y:420,w:650,h:430,src:rd.result,opacity:1});rd.readAsDataURL(f)};
bg.oninput=()=>{scene.background=bg.value;render()};name.oninput=()=>{};
$('new').onclick=()=>{scene={version:1,background:'#f7f2e8',layers:[]};selected=null;name.value='Untitled Design';bg.value=scene.background;status.textContent='New scene';render()};$('save').onclick=()=>{localStorage.setItem('tooldr-scene',JSON.stringify(scene));localStorage.setItem('tooldr-name',name.value);status.textContent='Saved locally ✓'};$('load').onclick=()=>{let s=localStorage.getItem('tooldr-scene');if(!s){status.textContent='No saved scene';return}scene=JSON.parse(s);name.value=localStorage.getItem('tooldr-name')||'Untitled Design';bg.value=scene.background;selected=null;status.textContent='Loaded locally ✓';render()};
$('exportJson').onclick=()=>{download('scene.json',JSON.stringify({name:name.value,scene},null,2),'application/json')};$('import').onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=ev=>{let f=ev.target.files[0];let rd=new FileReader();rd.onload=()=>{let o=JSON.parse(rd.result);scene=o.scene||o;name.value=o.name||'Imported Design';bg.value=scene.background;selected=null;render();status.textContent='Imported ✓'};rd.readAsText(f)};i.click()};
function download(fn,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('png').onclick=()=>{let clone=canvas.cloneNode(true);clone.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));let html='<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:'+scene.background+'}.canvas{position:relative;width:1080px;height:1350px;overflow:hidden;background:'+scene.background+'}.obj{position:absolute;display:flex;overflow:hidden}.text{white-space:pre-wrap;line-height:1.05}.img{background-position:center;background-size:cover}.rect{width:100%;height:100%}</style></head><body>'+clone.outerHTML+'</body></html>';let blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),w=window.open(url,'_blank');status.textContent='Export opened in a new tab — use browser Save/Print to PNG if needed'};
render();
</script></body></html>
