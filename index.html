<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ToolDr.ai — Design Editor v3</title>
<style>
:root{--bg:#0b0d10;--panel:#111419;--panel2:#171b21;--line:#292f38;--text:#f5f7fb;--muted:#8f98a6;--blue:#2d8cff;--blue2:#176bd0;--danger:#d74a57;--canvas:#f7f2e8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:#1b2027;color:var(--text);border-radius:8px;cursor:pointer}button:hover{background:#252b34}button:active{transform:translateY(1px)}
.app{height:100dvh;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:#101216;border-bottom:1px solid var(--line);z-index:50}.brand{font-weight:900;font-size:19px;white-space:nowrap}.brand b{color:#62b9ff}.brand span{font-size:9px;color:#68717d;letter-spacing:1.2px;margin-left:7px}.top-actions{display:flex;gap:6px;margin-left:auto;overflow:auto}.top-actions button{padding:8px 10px;white-space:nowrap;font-size:12px}.primary{background:var(--blue);border-color:var(--blue)}.primary:hover{background:var(--blue2)}
.workspace{min-height:0;display:grid;grid-template-columns:250px 1fr 300px}.panel{background:var(--panel);min-width:0;overflow:auto}.left{border-right:1px solid var(--line);padding:12px}.right{border-left:1px solid var(--line);padding:12px}.section{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;font-weight:800;color:var(--muted);margin:5px 0 9px}.add-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.add-grid button{padding:10px 4px;font-size:11px}.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.template-grid button{padding:9px 5px;font-size:10px}.layers{display:flex;flex-direction:column;gap:4px;margin-top:14px}.layer{display:grid;grid-template-columns:25px 1fr 26px 26px;align-items:center;gap:4px;padding:7px;border-radius:8px}.layer.sel{background:#17314a;border:1px solid #2e72a8}.layer-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:0;background:none}.layer-name:hover{background:none}.icon{font-size:11px;color:#68baff;font-weight:800}.mini{width:26px;height:26px;padding:0;font-size:11px}.hint{font-size:10px;color:#6e7784;line-height:1.45;margin-top:12px}
.stage{position:relative;min-width:0;min-height:0;background:#080a0d;display:flex;align-items:center;justify-content:center;overflow:hidden}.canvas-wrap{position:relative;box-shadow:0 24px 80px #000;flex:none}.canvas{display:block;background:var(--canvas);touch-action:none}.overlay{position:absolute;inset:0;pointer-events:none}.selection{position:absolute;border:1px solid #42a5ff;box-shadow:0 0 0 1px #0a5f9f}.handle{position:absolute;width:10px;height:10px;background:white;border:1px solid #1676bf;border-radius:2px;pointer-events:auto}.nw{left:-6px;top:-6px}.n{left:50%;top:-6px;transform:translateX(-50%)}.ne{right:-6px;top:-6px}.e{right:-6px;top:50%;transform:translateY(-50%)}.se{right:-6px;bottom:-6px}.s{left:50%;bottom:-6px;transform:translateX(-50%)}.sw{left:-6px;bottom:-6px}.w{left:-6px;top:50%;transform:translateY(-50%)}.rot{position:absolute;width:12px;height:12px;border-radius:50%;left:50%;top:-28px;transform:translateX(-50%);background:#42a5ff;border:2px solid white;pointer-events:auto}.rotline{position:absolute;left:50%;top:-18px;height:18px;border-left:1px dashed #42a5ff}.stagebar{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:5px;background:#15191f;border:1px solid var(--line);border-radius:10px;padding:5px}.stagebar button{width:30px;height:30px}.stagebar span{width:55px;text-align:center;font-size:11px;color:#bbc2cb}
.form{display:flex;flex-direction:column;gap:9px}.form label{font-size:10px;color:var(--muted);display:flex;flex-direction:column;gap:5px}.form input,.form select,.form textarea{width:100%;padding:8px;background:#0c0f13;border:1px solid var(--line);border-radius:7px;color:var(--text)}.form textarea{min-height:75px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row{display:flex;gap:6px}.row>*{flex:1}.color-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.toolrow{display:flex;gap:5px;flex-wrap:wrap}.toolrow button{padding:7px 9px;font-size:10px}.danger{background:#34191d;border-color:#5e282e}.danger:hover{background:#472126}.status{margin-top:12px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#0f1216;color:#80d39c;font-size:10px}.project{border-top:1px solid var(--line);padding-top:14px;margin-top:15px}.mobile-btn{display:none}
.drawer-backdrop{display:none}
@media(max-width:1000px){.workspace{grid-template-columns:210px 1fr}.right{position:fixed;z-index:45;right:0;top:58px;bottom:0;width:min(330px,92vw);transform:translateX(100%);transition:.2s;box-shadow:-20px 0 60px #000}.right.open{transform:none}.mobile-btn{display:block}.stage{grid-column:2}}
@media(max-width:700px){
.app{grid-template-rows:auto 1fr}.top{min-height:56px;flex-wrap:wrap;padding:7px}.brand{font-size:17px}.brand span{display:none}.top-actions{width:100%;margin:0;order:3}.top-actions button{font-size:10px;padding:7px 8px}.workspace{display:block}.left{position:fixed;z-index:45;left:0;top:56px;bottom:0;width:min(290px,88vw);transform:translateX(-100%);transition:.2s;box-shadow:20px 0 60px #000}.left.open{transform:none}.stage{width:100%;height:100%}.canvas-wrap{max-width:92vw;max-height:76vh}.stagebar{bottom:8px}.right{top:56px}.mobile-btn{display:block;padding:7px 9px;font-size:11px}.drawer-backdrop.on{display:block;position:fixed;inset:56px 0 0;background:#0008;z-index:40}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand">ToolDr<b>.ai</b><span>DESIGN EDITOR V3</span></div>
<button class="mobile-btn" id="layersBtn">☰ Layers</button>
<button class="mobile-btn" id="propsBtn">⚙ Edit</button>
<div class="top-actions">
<button id="newBtn">New</button><button id="saveBtn">Save</button><button id="loadBtn">Load</button><button id="importBtn">Import</button><button id="sceneBtn">JSON</button><button class="primary" id="pngBtn">Export PNG</button>
</div>
</header>
<div class="workspace">
<aside class="panel left" id="left">
<div class="section">Add</div>
<div class="add-grid"><button id="textBtn">＋ Text</button><button id="shapeBtn">＋ Shape</button><button id="imageBtn">＋ Image</button></div>
<input id="file" type="file" accept="image/*" hidden>
<div class="section" style="margin-top:16px">Quick templates</div>
<div class="template-grid"><button id="writingTpl">AI Writing</button><button id="newsTpl">AI News</button></div>
<div class="section" style="margin-top:17px">Layers</div>
<div class="layers" id="layers"></div>
<div class="hint">Select a layer to edit it. Drag on canvas to move. Blue handles resize. Top handle rotates. Locked layers cannot be moved.</div>
</aside>
<main class="stage">
<div class="canvas-wrap" id="wrap"><canvas id="canvas" class="canvas" width="1080" height="1350"></canvas><div class="overlay" id="overlay"></div></div>
<div class="stagebar"><button id="minus">−</button><span id="zoom">58%</span><button id="plus">＋</button><button id="fit">Fit</button></div>
</main>
<aside class="panel right" id="right">
<div class="section">Properties</div><div id="props" class="form"><div style="color:var(--muted);font-size:11px">Select a layer</div></div>
<div class="project form"><div class="section">Project</div><label>Name<input id="name" value="Untitled Design"></label><label>Background<input id="bg" type="color" value="#f7f2e8"></label><div class="status" id="status">Ready</div></div>
</aside>
</div>
<div class="drawer-backdrop" id="backdrop"></div>
</div>
<script>
'use strict';
const W=1080,H=1350, $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d'),wrap=$('wrap'),overlay=$('overlay'),layersEl=$('layers'),props=$('props');
const FONTS=['Inter','Arial','Georgia','Trebuchet MS','Courier New','Poppins','Montserrat','Impact'];
let scene={version:3,background:'#f7f2e8',layers:[]},selected=null,zoom=0.58,drag=null;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
const cur=()=>scene.layers.find(x=>x.id===selected);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function status(t){$('status').textContent=t}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function add(l){l.id=uid();scene.layers.push(l);selected=l.id;render()}
function addText(){add({type:'text',name:'Headline',x:100,y:120,w:800,h:120,text:'YOUR HEADLINE',fill:'#111',fontFamily:'Inter',fontSize:76,fontWeight:800,align:'left',opacity:1,rotation:0,lineHeight:1.08})}
function addShape(){add({type:'shape',name:'Shape',x:100,y:350,w:400,h:220,fill:'#2d8cff',radius:24,opacity:1,rotation:0})}
function addImage(file){const r=new FileReader();r.onload=()=>add({type:'image',name:file.name,x:100,y:350,w:650,h:430,src:r.result,opacity:1,rotation:0,fit:'cover'});r.readAsDataURL(file)}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function draw(c,l){if(l.hidden)return;c.save();c.globalAlpha=l.opacity??1;const cx=l.x+l.w/2,cy=l.y+l.h/2;c.translate(cx,cy);c.rotate((l.rotation||0)*Math.PI/180);
if(l.type==='shape'){c.fillStyle=l.fill||'#ddd';rr(c,-l.w/2,-l.h/2,l.w,l.h,l.radius||0);c.fill()}
if(l.type==='text'){c.fillStyle=l.fill||'#111';c.font=`${l.fontWeight||700} ${l.fontSize||56}px "${l.fontFamily||'Inter'}",Arial,sans-serif`;c.textBaseline='top';c.textAlign=l.align||'left';const lines=wrapText(c,String(l.text||''),l.w,l.fontSize||56);let tx=l.align==='center'?0:l.align==='right'?l.w/2:-l.w/2;lines.forEach((line,i)=>c.fillText(line,tx,-l.h/2+i*(l.fontSize||56)*(l.lineHeight||1.08)))}
if(l.type==='image'){if(l._img&&l._img.complete){const iw=l._img.naturalWidth||l._img.width,ih=l._img.naturalHeight||l._img.height,s=l.fit==='contain'?Math.min(l.w/iw,l.h/ih):Math.max(l.w/iw,l.h/ih),dw=iw*s,dh=ih*s;c.save();if(l.radius){rr(c,-l.w/2,-l.h/2,l.w,l.h,l.radius);c.clip()}c.drawImage(l._img,-dw/2,-dh/2,dw,dh);c.restore()}else{c.fillStyle='#d9dde3';c.fillRect(-l.w/2,-l.h/2,l.w,l.h)}}
c.restore()}
function wrapText(c,text,maxw,size){const out=[];for(const para of text.split('\\n')){let line='';for(const word of para.split(' ')){const test=line?line+' '+word:word;if(c.measureText(test).width>maxw&&line){out.push(line);line=word}else line=test}out.push(line)}return out}
function renderCanvas(){ctx.clearRect(0,0,W,H);ctx.fillStyle=scene.background;ctx.fillRect(0,0,W,H);scene.layers.forEach(l=>{if(l.src&&!l._img){l._img=new Image();l._img.onload=renderCanvas;l._img.src=l.src}draw(ctx,l)});renderOverlay()}
function renderOverlay(){overlay.innerHTML='';const l=cur();if(!l)return;const b=document.createElement('div');b.className='selection';b.style.left=l.x*zoom+'px';b.style.top=l.y*zoom+'px';b.style.width=l.w*zoom+'px';b.style.height=l.h*zoom+'px';b.style.transform=`rotate(${l.rotation||0}deg)`;b.style.transformOrigin='center';for(const p of ['nw','n','ne','e','se','s','sw','w']){const h=document.createElement('div');h.className='handle '+p;h.dataset.resize=p;h.onpointerdown=startResize;b.appendChild(h)}const line=document.createElement('div');line.className='rotline';b.appendChild(line);const r=document.createElement('div');r.className='rot';r.onpointerdown=startRotate;b.appendChild(r);overlay.appendChild(b)}
function renderLayers(){layersEl.innerHTML='';[...scene.layers].reverse().forEach(l=>{const row=document.createElement('div');row.className='layer '+(l.id===selected?'sel':'');row.innerHTML=`<span class="icon">${l.type==='text'?'T':l.type==='image'?'IMG':'▣'}</span><button class="layer-name">${esc(l.name||'Layer')}</button><button class="mini" data-v>${l.hidden?'◌':'◉'}</button><button class="mini" data-l>${l.locked?'🔒':'↕'}</button>`;row.querySelector('.layer-name').onclick=()=>{selected=l.id;render()};row.querySelector('[data-v]').onclick=()=>{l.hidden=!l.hidden;render()};row.querySelector('[data-l]').onclick=()=>{l.locked=!l.locked;render()};layersEl.appendChild(row)})}
function renderProps(){const l=cur();if(!l){props.innerHTML='<div style="color:var(--muted);font-size:11px">Select a layer</div>';return}
let s=`<label>Name<input data-k="name" value="${esc(l.name||'Layer')}"></label><div class="grid2"><label>X<input data-k="x" type="number" value="${Math.round(l.x)}"></label><label>Y<input data-k="y" type="number" value="${Math.round(l.y)}"></label><label>Width<input data-k="w" type="number" value="${Math.round(l.w)}"></label><label>Height<input data-k="h" type="number" value="${Math.round(l.h)}"></label><label>Rotation<input data-k="rotation" type="number" value="${Math.round(l.rotation||0)}"></label><label>Opacity<input data-k="opacity" type="number" min="0" max="1" step=".05" value="${l.opacity??1}"></label></div>`;
if(l.type==='text')s+=`<label>Text<textarea data-k="text">${esc(l.text||'')}</textarea></label><label>Font<select data-k="fontFamily">${FONTS.map(f=>`<option ${f===(l.fontFamily||'Inter')?'selected':''}>${f}</option>`).join('')}</select></label><div class="grid2"><label>Size<input data-k="fontSize" type="number" value="${l.fontSize||56}"></label><label>Weight<input data-k="fontWeight" type="number" step="100" min="100" max="900" value="${l.fontWeight||700}"></label><label>Color<input data-k="fill" type="color" value="${l.fill||'#111111'}"></label><label>Line height<input data-k="lineHeight" type="number" step=".05" min=".8" max="2" value="${l.lineHeight||1.08}"></label></div><label>Alignment<select data-k="align"><option ${l.align==='left'?'selected':''}>left</option><option ${l.align==='center'?'selected':''}>center</option><option ${l.align==='right'?'selected':''}>right</option></select></label>`;
if(l.type==='shape')s+=`<div class="grid2"><label>Fill<input data-k="fill" type="color" value="${l.fill||'#2d8cff'}"></label><label>Radius<input data-k="radius" type="number" value="${l.radius||0}"></label></div>`;
if(l.type==='image')s+=`<label>Fit<select data-k="fit"><option ${l.fit==='cover'?'selected':''}>cover</option><option ${l.fit==='contain'?'selected':''}>contain</option></select></label>`;
s+=`<div class="toolrow"><button id="dup">Duplicate</button><button id="front">Front</button><button id="back">Back</button></div><button id="del" class="danger">Delete layer</button>`;
props.innerHTML=s;props.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{let k=i.dataset.k,v=i.value;if(['x','y','w','h','rotation','opacity','fontSize','fontWeight','radius','lineHeight'].includes(k))v=Number(v);l[k]=v;normalize(l);render()});$('del').onclick=()=>{scene.layers=scene.layers.filter(x=>x.id!==l.id);selected=null;render()};$('dup').onclick=()=>{const c={...l,id:uid(),name:(l.name||'Layer')+' copy',x:l.x+24,y:l.y+24};scene.layers.push(c);selected=c.id;render()};$('front').onclick=()=>{scene.layers=scene.layers.filter(x=>x.id!==l.id);scene.layers.push(l);render()};$('back').onclick=()=>{scene.layers=scene.layers.filter(x=>x.id!==l.id);scene.layers.unshift(l);render()}}
function normalize(l){l.w=clamp(Number(l.w)||20,20,W);l.h=clamp(Number(l.h)||20,20,H);l.x=clamp(Number(l.x)||0,0,W-l.w);l.y=clamp(Number(l.y)||0,0,H-l.h);l.opacity=clamp(Number(l.opacity??1),0,1);l.rotation=Number(l.rotation)||0}
function render(){renderCanvas();renderLayers();renderProps();$('bg').value=scene.background;$('zoom').textContent=Math.round(zoom*100)+'%';wrap.style.width=W*zoom+'px';wrap.style.height=H*zoom+'px';canvas.style.width=W*zoom+'px';canvas.style.height=H*zoom+'px'}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function hit(x,y){for(let i=scene.layers.length-1;i>=0;i--){const l=scene.layers[i];if(l.hidden)continue;const a=-(l.rotation||0)*Math.PI/180,cx=l.x+l.w/2,cy=l.y+l.h/2,dx=x-cx,dy=y-cy,rx=dx*Math.cos(a)-dy*Math.sin(a),ry=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(rx)<=l.w/2&&Math.abs(ry)<=l.h/2)return l}return null}
canvas.onpointerdown=e=>{const p=point(e),l=hit(p.x,p.y);selected=l?l.id:null;if(l&&!l.locked)drag={sx:p.x,sy:p.y,ox:l.x,oy:l.y};render()};
window.onpointermove=e=>{if(!drag)return;const l=cur();if(!l)return;const p=point(e);l.x=drag.ox+p.x-drag.sx;l.y=drag.oy+p.y-drag.sy;normalize(l);render()};
window.onpointerup=()=>drag=null;
function startResize(e){e.stopPropagation();const l=cur();if(!l||l.locked)return;const p=point(e);drag={resize:e.currentTarget.dataset.resize,sx:p.x,sy:p.y,ox:l.x,oy:l.y,ow:l.w,oh:l.h}}
function startRotate(e){e.stopPropagation();const l=cur();if(!l||l.locked)return;const r=canvas.getBoundingClientRect();drag={rotate:1,cx:r.left+(l.x+l.w/2)/W*r.width,cy:r.top+(l.y+l.h/2)/H*r.height,base:l.rotation||0}}
const oldMove=window.onpointermove;window.onpointermove=e=>{if(!drag)return;const l=cur();if(!l)return;if(drag.resize){const p=point(e),dx=p.x-drag.sx,dy=p.y-drag.sy;let x=drag.ox,y=drag.oy,w=drag.ow,h=drag.oh;if(drag.resize.includes('e'))w=drag.ow+dx;if(drag.resize.includes('s'))h=drag.oh+dy;if(drag.resize.includes('w')){x=drag.ox+dx;w=drag.ow-dx}if(drag.resize.includes('n')){y=drag.oy+dy;h=drag.oh-dy}l.x=x;l.y=y;l.w=Math.max(20,w);l.h=Math.max(20,h);normalize(l)}else if(drag.rotate){l.rotation=Math.round(Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx)*180/Math.PI+90)}else{const p=point(e);l.x=drag.ox+p.x-drag.sx;l.y=drag.oy+p.y-drag.sy;normalize(l)}render()};
$('textBtn').onclick=addText;$('shapeBtn').onclick=addShape;$('imageBtn').onclick=()=>$('file').click();$('file').onchange=e=>{if(e.target.files[0])addImage(e.target.files[0]);e.target.value=''};
$('bg').oninput=()=>{scene.background=$('bg').value;renderCanvas()};
$('newBtn').onclick=()=>{scene={version:3,background:'#f7f2e8',layers:[]};selected=null;$('name').value='Untitled Design';status('New scene');render()};
$('saveBtn').onclick=()=>{const c=JSON.parse(JSON.stringify(scene));localStorage.setItem('tooldr-v3',JSON.stringify(strip(scene)));localStorage.setItem('tooldr-name', $('name').value);status('Saved locally ✓')};
$('loadBtn').onclick=()=>{const s=localStorage.getItem('tooldr-v3');if(!s){status('No saved scene');return}scene=JSON.parse(s);selected=null;$('name').value=localStorage.getItem('tooldr-name')||'Untitled Design';status('Loaded ✓');render()};
$('sceneBtn').onclick=()=>download('tooldr-scene.json',JSON.stringify({name:$('name').value,scene:strip(scene)},null,2),'application/json');
$('importBtn').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);scene=o.scene||o;scene.version=3;selected=null;$('name').value=o.name||'Imported Design';status('Imported ✓');render()}catch(_){status('Invalid JSON')}};r.readAsText(f)};i.click()};
function strip(s){const c=JSON.parse(JSON.stringify(s));c.layers.forEach(l=>delete l._img);return c}
function download(n,d,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('pngBtn').onclick=async()=>{status('Rendering PNG…');const out=document.createElement('canvas');out.width=W;out.height=H;const c=out.getContext('2d');c.fillStyle=scene.background;c.fillRect(0,0,W,H);for(const l of scene.layers){if(l.hidden)continue;if(l.type==='image'&&l.src&&!l._img)await new Promise(res=>{l._img=new Image();l._img.onload=res;l._img.onerror=res;l._img.src=l.src});draw(c,l)}const a=document.createElement('a');a.href=out.toDataURL('image/png');a.download=($('name').value||'tooldr-design').replace(/[^a-z0-9-_]+/gi,'-')+'.png';a.click();status('PNG exported ✓')};
$('minus').onclick=()=>{zoom=clamp(zoom-.08,.25,1.2);render()};$('plus').onclick=()=>{zoom=clamp(zoom+.08,.25,1.2);render()};$('fit').onclick=()=>{const s=document.querySelector('.stage');zoom=clamp(Math.min((s.clientWidth-40)/W,(s.clientHeight-70)/H),.25,1);render()};
function drawer(el){el.classList.toggle('open');$('backdrop').classList.toggle('on',el.classList.contains('open'))}
$('layersBtn').onclick=()=>drawer($('left'));$('propsBtn').onclick=()=>drawer($('right'));$('backdrop').onclick=()=>{$('left').classList.remove('open');$('right').classList.remove('open');$('backdrop').classList.remove('on')};
function templateWriting(){scene={version:3,background:'#f7f2e8',layers:[]};add({type:'text',name:'Top label',x:70,y:55,w:940,h:35,text:'AI TOOLS  •  WRITING',fill:'#222',fontFamily:'Inter',fontSize:22,fontWeight:700,align:'left',opacity:1,rotation:0});add({type:'text',name:'Title',x:70,y:130,w:900,h:150,text:'AI WRITING\\nTOOLS',fill:'#111',fontFamily:'Inter',fontSize:88,fontWeight:900,align:'left',opacity:1,rotation:0,lineHeight:1});add({type:'text',name:'Subtitle',x:70,y:315,w:650,h:100,text:'Write, rewrite, summarize and create better content — faster with AI.',fill:'#555',fontFamily:'Inter',fontSize:30,fontWeight:500,align:'left',opacity:1,rotation:0,lineHeight:1.25});add({type:'shape',name:'Hero panel',x:675,y:455,w:320,h:470,fill:'#dce9f7',radius:32,opacity:1,rotation:0});add({type:'shape',name:'Laptop screen',x:710,y:510,w:250,h:180,fill:'#202833',radius:14,opacity:1,rotation:0});add({type:'text',name:'ChatGPT mock',x:735,y:555,w:200,h:90,text:'Write better.\\nCreate faster.',fill:'#fff',fontFamily:'Inter',fontSize:27,fontWeight:800,align:'left',opacity:1,rotation:0,lineHeight:1.1});['Write 10× Faster','Better Content','Beat Writer’s Block','For Everyone'].forEach((t,i)=>{add({type:'shape',name:t+' card',x:70,y:470+i*150,w:530,h:112,fill:i%2?'#fff':'#eef3f8',radius:18,opacity:1,rotation:0});add({type:'text',name:t,x:105,y:495+i*150,w:450,h:45,text:t,fill:'#111',fontFamily:'Inter',fontSize:30,fontWeight:800,align:'left',opacity:1,rotation:0})});add({type:'shape',name:'CTA',x:70,y:1100,w:920,h:150,fill:'#111',radius:24,opacity:1,rotation:0});add({type:'text',name:'CTA text',x:105,y:1130,w:600,h:90,text:'Top tools to boost your writing',fill:'#fff',fontFamily:'Inter',fontSize:30,fontWeight:800,align:'left',opacity:1,rotation:0});selected=null;render();status('AI Writing template loaded — every element is editable')};
function templateNews(){scene={version:3,background:'#f7f2e8',layers:[]};add({type:'text',name:'Kicker',x:70,y:65,w:900,h:40,text:'TOOLDR.AI  •  AI NEWS',fill:'#2d8cff',fontSize:24,fontWeight:800,fontFamily:'Inter',align:'left',opacity:1,rotation:0});add({type:'text',name:'Headline',x:70,y:140,w:940,h:220,text:'THE AI NEWS\\nYOU NEED TO KNOW',fill:'#111',fontSize:76,fontWeight:900,fontFamily:'Inter',align:'left',opacity:1,rotation:0,lineHeight:1.02});add({type:'shape',name:'News image placeholder',x:70,y:420,w:940,h:470,fill:'#d9e2ea',radius:28,opacity:1,rotation:0});add({type:'text',name:'Story',x:90,y:925,w:900,h:110,text:'What changed, why it matters, and what happens next.',fill:'#333',fontSize:32,fontWeight:600,fontFamily:'Inter',align:'left',opacity:1,rotation:0});add({type:'shape',name:'CTA',x:70,y:1110,w:940,h:130,fill:'#2d8cff',radius:22,opacity:1,rotation:0});add({type:'text',name:'CTA text',x:105,y:1140,w:850,h:70,text:'FOLLOW FOR DAILY AI UPDATES →',fill:'#fff',fontSize:28,fontWeight:900,fontFamily:'Inter',align:'left',opacity:1,rotation:0});selected=null;render();status('AI News template loaded — editable layers ready')};
$('writingTpl').onclick=templateWriting;$('newsTpl').onclick=templateNews;
window.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('saveBtn').click()}if((e.key==='Delete'||e.key==='Backspace')&&cur()&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){scene.layers=scene.layers.filter(x=>x.id!==selected);selected=null;render()}};
window.onresize=()=>render();templateWriting();
</script>
</body>
